<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="Personal dashboard for UG Sakai">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/app/icons/icon-192.png">
  <link rel="stylesheet" href="/app/styles.css">
  <title>Sakai · Personal</title>
</head>
<body>
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-brand">
        <img src="/app/icons/icon-192.png" alt="" width="56" height="56">
        <div>
          <h1>UG Sakai</h1>
          <p>Personal dashboard</p>
        </div>
      </div>
      <form id="login-form">
        <label for="login-id">Student ID</label>
        <input id="login-id" name="username" autocomplete="username" required placeholder="22553484">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••••">
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <button id="login-env" class="btn btn-ghost" type="button" hidden>Use credentials from .env</button>
      <p id="login-error" class="login-error" role="alert"></p>
      <p class="login-note">Your credentials stay on this machine. They are sent only to the local proxy, which forwards them to Sakai over HTTPS.</p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <img src="/app/icons/icon-192.png" alt="" width="34" height="34">
        <span>UG Sakai <small>personal</small></span>
      </div>
      <nav id="nav" class="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <div id="sync-status" class="sync-status">Not synced</div>
        <button id="refresh-btn" class="btn btn-small btn-ghost" type="button">↻ Refresh</button>
        <button id="logout-btn" class="btn btn-small btn-ghost" type="button">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle" class="subtitle"></p>
        </div>
        <div class="topbar-right">
          <label class="select-wrap">
            <span>Course</span>
            <select id="site-filter"><option value="">All courses</option></select>
          </label>
          <div id="user-chip" class="user-chip"></div>
        </div>
      </header>
      <div id="content" class="content" aria-live="polite"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app/app.js" defer></script>
</body>
</html>
